<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Priyank Ramani</h1>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
</body>
<script>
    const sayMyName = function(str){
        console.log(str, Date.now());
    }
    // The foloowing code will do this : If I press start then it will print. If I press stop then it will be stopped
    let intervalID;
    document.querySelector('#start').addEventListener('click', function(){
         intervalID = setInterval(sayMyName, 1000, "Priyank");
    })
    document.querySelector('#stop').addEventListener('click', function(){
        clearInterval(intervalID);
    })

</script>
</html>
